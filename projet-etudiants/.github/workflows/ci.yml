name: CI

on:
  push:
    branches: [ main, version-2, version-3 ]
  pull_request:
    branches: [ main, version-2, version-3 ]

jobs:
  build-etudiant-service:
    name: Build & Test etudiant-service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: etudiants
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build etudiant-service
        working-directory: api-spring-boot
        run: mvn clean verify -Dspring.datasource.url=jdbc:postgresql://localhost:5432/etudiants

      - name: Build grading-service
        working-directory: grading-service
        run: mvn clean package -DskipTests

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build Next.js
        working-directory: frontend
        run: npm run build
